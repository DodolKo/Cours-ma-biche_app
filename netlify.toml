[build]
  # Dossier de build
  publish = "dist"
  
  # Commande de build
  command = "npm run build:netlify"

[build.environment]
  # Version de Node.js (Vite nécessite 20.19+ ou 22.12+)
  NODE_VERSION = "20"
  
  # Configuration du scanner de secrets
  SECRETS_SCAN_ENABLED = "true"
  SECRETS_SCAN_OMIT_PATHS = "src/**,*.vue,*.js,*.css"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
  
  # Variables d'environnement Supabase (à remplacer par vos vraies valeurs)
  # VITE_SUPABASE_URL = "https://votre-projet.supabase.co"
  # VITE_SUPABASE_ANON_KEY = "votre_clé_anonyme"

# Redirections pour SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers pour le service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Headers pour le manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
